<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Width Image Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .hero-carousel-wrapper {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .hero-carousel-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .hero-carousel-slide {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .hero-carousel-slide.active-hero-slide {
            opacity: 1;
        }

        /* Navigation Arrows */
        .hero-carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            font-size: 24px;
            padding: 15px 20px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .hero-carousel-nav:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .hero-carousel-prev {
            left: 20px;
            border-radius: 0 8px 8px 0;
        }

        .hero-carousel-next {
            right: 20px;
            border-radius: 8px 0 0 8px;
        }

        /* Pagination Dots */
        .hero-carousel-pagination {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

        .hero-carousel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .hero-carousel-dot:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: scale(1.1);
        }

        .hero-carousel-dot.active-hero-dot {
            background: white;
            width: 32px;
            border-radius: 6px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero-carousel-wrapper {
                height: 60vh;
            }

            .hero-carousel-nav {
                font-size: 18px;
                padding: 10px 15px;
            }

            .hero-carousel-prev {
                left: 10px;
            }

            .hero-carousel-next {
                right: 10px;
            }

            .hero-carousel-pagination {
                bottom: 20px;
                gap: 8px;
                padding: 10px 15px;
            }

            .hero-carousel-dot {
                width: 10px;
                height: 10px;
            }

            .hero-carousel-dot.active-hero-dot {
                width: 24px;
            }
        }

        @media (max-width: 480px) {
            .hero-carousel-wrapper {
                height: 50vh;
            }

            .hero-carousel-nav {
                font-size: 16px;
                padding: 8px 12px;
            }

            .hero-carousel-pagination {
                gap: 6px;
                padding: 8px 12px;
            }

            .hero-carousel-dot {
                width: 8px;
                height: 8px;
            }

            .hero-carousel-dot.active-hero-dot {
                width: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="hero-carousel-wrapper">
        <div class="hero-carousel-container">
            <!-- Slides with background images -->
            <div class="hero-carousel-slide active-hero-slide" style="background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80');"></div>
            <div class="hero-carousel-slide" style="background-image: url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920&q=80');"></div>
            <div class="hero-carousel-slide" style="background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=80');"></div>
            <div class="hero-carousel-slide" style="background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1920&q=80');"></div>
        </div>

        <!-- Navigation Arrows -->
        <button class="hero-carousel-nav hero-carousel-prev" onclick="heroCarouselController.prevSlide()">❮</button>
        <button class="hero-carousel-nav hero-carousel-next" onclick="heroCarouselController.nextSlide()">❯</button>

        <!-- Pagination Dots -->
        <div class="hero-carousel-pagination" id="heroCarouselPagination"></div>
    </div>

    <script>
        // Unique slider controller to avoid conflicts
        const heroCarouselController = (function() {
            let currentSlideIndex = 0;
            let autoplayIntervalId = null;
            const autoplayDelay = 4000; // 4 seconds
            
            const slides = document.querySelectorAll('.hero-carousel-slide');
            const paginationContainer = document.getElementById('heroCarouselPagination');
            
            // Initialize pagination dots
            function initPagination() {
                slides.forEach((_, index) => {
                    const dot = document.createElement('div');
                    dot.className = 'hero-carousel-dot';
                    if (index === 0) dot.classList.add('active-hero-dot');
                    dot.onclick = () => goToSlide(index);
                    paginationContainer.appendChild(dot);
                });
            }
            
            // Update active slide and dot
            function updateSlider() {
                slides.forEach((slide, index) => {
                    slide.classList.remove('active-hero-slide');
                    if (index === currentSlideIndex) {
                        slide.classList.add('active-hero-slide');
                    }
                });
                
                const dots = document.querySelectorAll('.hero-carousel-dot');
                dots.forEach((dot, index) => {
                    dot.classList.remove('active-hero-dot');
                    if (index === currentSlideIndex) {
                        dot.classList.add('active-hero-dot');
                    }
                });
            }
            
            // Go to specific slide
            function goToSlide(index) {
                currentSlideIndex = index;
                updateSlider();
                resetAutoplay();
            }
            
            // Next slide
            function nextSlide() {
                currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                updateSlider();
                resetAutoplay();
            }
            
            // Previous slide
            function prevSlide() {
                currentSlideIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
                updateSlider();
                resetAutoplay();
            }
            
            // Start autoplay
            function startAutoplay() {
                autoplayIntervalId = setInterval(nextSlide, autoplayDelay);
            }
            
            // Stop autoplay
            function stopAutoplay() {
                if (autoplayIntervalId) {
                    clearInterval(autoplayIntervalId);
                    autoplayIntervalId = null;
                }
            }
            
            // Reset autoplay (restart timer)
            function resetAutoplay() {
                stopAutoplay();
                startAutoplay();
            }
            
            // Initialize slider
            function init() {
                initPagination();
                startAutoplay();
                
                // Pause autoplay on hover
                const wrapper = document.querySelector('.hero-carousel-wrapper');
                wrapper.addEventListener('mouseenter', stopAutoplay);
                wrapper.addEventListener('mouseleave', startAutoplay);
            }
            
            // Public API
            return {
                init,
                nextSlide,
                prevSlide,
                goToSlide
            };
        })();
        
        // Initialize slider when DOM is ready
        document.addEventListener('DOMContentLoaded', heroCarouselController.init);
    </script>
</body>
</html>
